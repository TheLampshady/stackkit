name: AI Skills Issue
description: Report an issue with AI skills or agent behavior
title: "[AI Skills]: "
labels: ["ai-skills", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this AI skills issue. Please fill out the sections below to help us understand and reproduce the problem.

  - type: dropdown
    id: tech-stack
    attributes:
      label: Current Tech Stack
      description: Which AI tool/platform were you using?
      multiple: true
      options:
        - Claude Code
        - GitHub Copilot
        - Cursor
        - Gemini
        - ChatGPT
        - Other (specify in description)
    validations:
      required: true

  - type: textarea
    id: additional-stack
    attributes:
      label: Additional Stack Details
      description: Any additional context about your environment (IDE, language, frameworks, etc.)
      placeholder: |
        - IDE: VS Code
        - Language: Python 3.12
        - Framework: FastAPI
    validations:
      required: false

  - type: textarea
    id: what-asked
    attributes:
      label: What You Asked
      description: Provide the exact prompt or request you made to the AI.
      placeholder: "Paste your prompt here..."
    validations:
      required: true

  - type: textarea
    id: what-got
    attributes:
      label: What You Got
      description: Describe or paste the actual response/output from the AI.
      placeholder: "Paste or describe the AI's response..."
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What You Expected
      description: Describe what you expected the AI to do or return.
      placeholder: "Describe your expected outcome..."
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or information that might help.
    validations:
      required: false
