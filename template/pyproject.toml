[project]
name = "stackkit-app"
version = "0.1.0"
description = "stackkit-app workspace"
readme = "Readme.md"
requires-python = "==3.13.*"
dependencies = []

[tool.uv.workspace]
members = ["service", "agent_service", "gcp", "notebooks"]
# stackkit:begin notebooks
# Resolved on its own: the Vertex AI prediction image pins an older fastapi than the service
exclude = ["notebooks/custom_model"]
# stackkit:end notebooks

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

# Lint configuration

[tool.ruff]
line-length = 88
lint.extend-select = ["B"]  # import sorting

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"**/routes/*.py" = ["B008"]
"*.ipynb" = ["E402"]
