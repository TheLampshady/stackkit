[project]
name = "agents"
version = "0.1.0"
description = "stackkit-app Agent Service"
requires-python = "==3.13.*"
dependencies = [
    "google-adk>=2.12.0",
    "google-cloud-aiplatform[adk,agent-engines]>=2.5.0",
    "firebase-admin>=7.7.0",
    "google-cloud-logging>=3.17.0",
    "google-cloud-secret-manager>=2.31.0",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-socket",
    "--allow-hosts=127.0.0.1,localhost",
]

[tool.ty.environment]
python-version = "3.13"
root = ["."]

[[tool.ty.overrides]]
include = ["tests/*.py"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
include = ["agents/**/*.py", "deploy.py", "gcp_services/**/*.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"
invalid-argument-type = "ignore"
