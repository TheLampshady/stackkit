[project]
name = "notebooks"
version = "0.1.0"
description = "stackkit-app Jupyter notebooks for AI/ML experiments"
requires-python = "==3.13.*"
dependencies = [
    "google-cloud-aiplatform>=2.5.0",
    "google-genai>=2.31.0",
    "google-adk>=2.12.0",
    # The service's Firebase clients, for service_test.ipynb
    "firebase-admin>=7.7.0",
    "google-cloud-logging>=3.17.0",
    "google-cloud-secret-manager>=2.31.0",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "ipython>=9.17.1",
    "jupyter>=1.1.1",
    "nest-asyncio>=1.6.0",
]

